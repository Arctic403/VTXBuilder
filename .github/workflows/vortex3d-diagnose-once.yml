name: Vortex3D One-Shot Gradle Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vortex3d-diagnose-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact private Vortex3D commit
        uses: actions/checkout@v4
        with:
          repository: Arctic403/Vortex3d
          ref: 4351edb26e69a84e389247c18ddb31fe3a88342e
          token: ${{ secrets.VORTEX_PRIVATE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install shader compiler
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y glslc >/dev/null
          glslc --version

      - name: Run APK build privately and capture diagnostics
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/vortex-diagnostic"
          gradle -p android :app:assembleDebug --no-daemon >"$RUNNER_TEMP/vortex-diagnostic/android-apk-build.log" 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Return diagnostic summary to private Vortex3D
        env:
          GH_TOKEN: ${{ secrets.VORTEX_PRIVATE_TOKEN }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=4351edb26e69a84e389247c18ddb31fe3a88342e
          SHORT_SHA=${SOURCE_SHA:0:8}
          TAG="worker-diagnostic-${GITHUB_RUN_ID}-${SHORT_SHA}"
          LOG="$RUNNER_TEMP/vortex-diagnostic/android-apk-build.log"
          NOTES="$RUNNER_TEMP/vortex-diagnostic/notes.txt"
          {
            echo "One-shot Gradle diagnostic from public VTXBuilder run ${GITHUB_RUN_ID}."
            echo "Source ${SOURCE_SHA}. Build exit ${BUILD_STATUS}."
            echo
            echo '```text'
            tail -n 220 "$LOG"
            echo '```'
          } > "$NOTES"
          gh release create "$TAG" "$LOG" \
            --repo Arctic403/Vortex3d \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Vortex3D private Gradle diagnostic ${SHORT_SHA}" \
            --notes-file "$NOTES"
