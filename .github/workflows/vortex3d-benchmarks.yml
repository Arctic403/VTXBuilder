name: Vortex3D Performance Benchmarks

on:
  workflow_call:
    inputs:
      scale:
        description: Requested benchmark element scale
        required: true
        type: string
      artifact_prefix:
        description: Prefix for uploaded artifacts
        required: false
        default: vortex
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scale
        env:
          VTX_SCALE: ${{ inputs.scale }}
        run: |
          case "$VTX_SCALE" in
            10000|100000|1000000) ;;
            *) echo "Unsupported benchmark scale: $VTX_SCALE" >&2; exit 2 ;;
          esac
      - name: Configure Release benchmark
        run: >-
          cmake -S . -B build-bench
          -DCMAKE_BUILD_TYPE=Release
          -DVORTEX_BUILD_TESTS=OFF
          -DVORTEX_BUILD_BENCHMARKS=ON
          -DVORTEX_WARNINGS_AS_ERRORS=ON
      - name: Build benchmarks
        run: cmake --build build-bench --target vortex_mesh_bench vortex_eval_bench --parallel
      - name: Run benchmarks
        env:
          VTX_SCALE: ${{ inputs.scale }}
        run: |
          ./build-bench/vortex_mesh_bench --scale "$VTX_SCALE" --output "benchmark-$VTX_SCALE.json"
          ./build-bench/vortex_eval_bench --scale "$VTX_SCALE" --output "evaluation-benchmark-$VTX_SCALE.json"
      - name: Show results
        env:
          VTX_SCALE: ${{ inputs.scale }}
        run: |
          cat "benchmark-$VTX_SCALE.json"
          cat "evaluation-benchmark-$VTX_SCALE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-benchmark-${{ inputs.scale }}-${{ github.sha }}
          path: |
            benchmark-${{ inputs.scale }}.json
            evaluation-benchmark-${{ inputs.scale }}.json
          retention-days: 30
