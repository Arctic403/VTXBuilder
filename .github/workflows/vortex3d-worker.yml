name: Vortex3D Private Build Worker

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact Vortex3D branch, tag, or commit to build
        required: true
        default: main
        type: string
      client_id:
        description: Optional local/editor correlation id returned in the private release notes
        required: false
        default: ''
        type: string
      mode:
        description: Worker mode
        required: true
        default: full
        type: choice
        options: [full, benchmark]
      scale:
        description: Benchmark scale when mode=benchmark
        required: false
        default: '10000'
        type: choice
        options: ['10000', '100000', '1000000']
      publish:
        description: Return completed outputs to private Vortex3D as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: vortex3d-private-worker
  cancel-in-progress: true

jobs:
  resolve-vortex-source:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      publish: ${{ steps.resolve.outputs.publish }}
      mode: ${{ steps.resolve.outputs.mode }}
      scale: ${{ steps.resolve.outputs.scale }}
      client_id: ${{ steps.resolve.outputs.client_id }}
    steps:
      - name: Resolve exact private Vortex3D source
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.VORTEX_PRIVATE_TOKEN }}
          INPUT_REF: ${{ inputs.source_ref }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SCALE: ${{ inputs.scale }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'VORTEX_PRIVATE_TOKEN is required.' >&2; exit 1; }
          SOURCE_REF="${INPUT_REF:-main}"
          MODE="${INPUT_MODE:-full}"
          SCALE="${INPUT_SCALE:-10000}"
          PUBLISH="${INPUT_PUBLISH:-true}"
          CLIENT_ID="${INPUT_CLIENT_ID:-manual-${GITHUB_RUN_ID}}"
          case "$MODE" in full|benchmark) ;; *) echo "Unsupported mode: $MODE" >&2; exit 2 ;; esac
          case "$SCALE" in 10000|100000|1000000) ;; *) echo "Unsupported scale: $SCALE" >&2; exit 2 ;; esac
          SOURCE_SHA="$(gh api "repos/Arctic403/Vortex3d/commits/${SOURCE_REF}" --jq '.sha')"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "scale=$SCALE" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved private Vortex3D ${SOURCE_REF} -> ${SOURCE_SHA} (${MODE}, client ${CLIENT_ID})"

  full-verification-build:
    needs: resolve-vortex-source
    if: ${{ needs.resolve-vortex-source.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ needs.resolve-vortex-source.outputs.source_sha }}
      PUBLISH: ${{ needs.resolve-vortex-source.outputs.publish }}
      CLIENT_ID: ${{ needs.resolve-vortex-source.outputs.client_id }}
    steps:
      - name: Check out VTXBuilder worker code
        uses: actions/checkout@v5
        with:
          path: worker
          persist-credentials: false
          fetch-depth: 1

      - name: Check out exact private Vortex3D commit
        uses: actions/checkout@v5
        with:
          repository: Arctic403/Vortex3d
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VORTEX_PRIVATE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run full private verification
        timeout-minutes: 80
        run: bash worker/scripts/vortex3d-full.sh source

      - name: Create Vortex3D artifact manifest
        if: ${{ success() && env.PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vortex-output"
          cat > "$RUNNER_TEMP/vortex-output/build-manifest.json" <<EOF
          {
            "source_sha": "${SOURCE_SHA}",
            "builder": "Arctic403/VTXBuilder",
            "run_id": "${GITHUB_RUN_ID}",
            "client_id": "${CLIENT_ID}",
            "mode": "full",
            "verification": "passed",
            "artifact_policy": "vortex3d-prerelease-only"
          }
          EOF

      - name: Return successful build to private Vortex3D prerelease
        if: ${{ success() && env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.VORTEX_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:8}"
          TAG="worker-${GITHUB_RUN_ID}-${SHORT_SHA}"
          gh release create "$TAG" "$RUNNER_TEMP"/vortex-output/* \
            --repo Arctic403/Vortex3d \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Vortex3D worker build ${SHORT_SHA}" \
            --notes "Vortex3D full verification build produced by public Arctic403/VTXBuilder run ${GITHUB_RUN_ID}. Source ${SOURCE_SHA}. Mode full. Client ${CLIENT_ID}. Artifacts are published only through the private Vortex3D prerelease channel."

      - name: Return private failure diagnostics
        if: ${{ failure() && env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.VORTEX_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:8}"
          TAG="worker-failed-${GITHUB_RUN_ID}-${SHORT_SHA}"
          mkdir -p "$RUNNER_TEMP/vortex-output" "$RUNNER_TEMP/vortex-private-logs"
          printf 'source_sha=%s\nclient_id=%s\nbuilder_run_id=%s\n' "$SOURCE_SHA" "$CLIENT_ID" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/vortex-private-logs/failure-context.txt"
          (cd "$RUNNER_TEMP/vortex-private-logs" && zip -qr "$RUNNER_TEMP/vortex-output/Vortex3D-worker-failure-${SHORT_SHA}.zip" .)
          gh release create "$TAG" "$RUNNER_TEMP/vortex-output/Vortex3D-worker-failure-${SHORT_SHA}.zip" \
            --repo Arctic403/Vortex3d \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Vortex3D worker FAILED ${SHORT_SHA}" \
            --notes "Public VTXBuilder run ${GITHUB_RUN_ID} failed while verifying private Vortex3D source ${SOURCE_SHA}. Mode full. Client ${CLIENT_ID}. Detailed logs are attached privately."

      - name: Confirm public worker retained no build artifact
        if: ${{ always() }}
        run: echo 'VTXBuilder intentionally uses no actions/upload-artifact for private Vortex3D builds.'

  benchmark-build:
    needs: resolve-vortex-source
    if: ${{ needs.resolve-vortex-source.outputs.mode == 'benchmark' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ needs.resolve-vortex-source.outputs.source_sha }}
      SCALE: ${{ needs.resolve-vortex-source.outputs.scale }}
      PUBLISH: ${{ needs.resolve-vortex-source.outputs.publish }}
      CLIENT_ID: ${{ needs.resolve-vortex-source.outputs.client_id }}
    steps:
      - name: Check out VTXBuilder worker code
        uses: actions/checkout@v5
        with:
          path: worker
          persist-credentials: false
          fetch-depth: 1

      - name: Check out exact private Vortex3D commit
        uses: actions/checkout@v5
        with:
          repository: Arctic403/Vortex3d
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VORTEX_PRIVATE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Build benchmark privately on public worker
        run: bash worker/scripts/vortex3d-benchmark.sh source

      - name: Return benchmark to private Vortex3D prerelease
        if: ${{ success() && env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.VORTEX_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:8}"
          TAG="benchmark-${GITHUB_RUN_ID}-${SHORT_SHA}-${SCALE}"
          gh release create "$TAG" "$RUNNER_TEMP"/vortex-benchmark-output/* \
            --repo Arctic403/Vortex3d \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Vortex3D benchmark ${SHORT_SHA} (${SCALE})" \
            --notes "Benchmark built by public Arctic403/VTXBuilder run ${GITHUB_RUN_ID}. Source ${SOURCE_SHA}. Mode benchmark. Scale ${SCALE}. Client ${CLIENT_ID}. No public Actions artifact was uploaded."
